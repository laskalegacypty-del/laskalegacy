<!DOCTYPE html>
<html>
<head>
  <title>Laska Legacy Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    body{font-family:sans-serif;max-width:1200px;margin:40px auto;padding:0 20px}
    input,select,button,textarea{padding:10px;margin:6px 0;width:100%;box-sizing:border-box}
    button{cursor:pointer;background:#0aa7a7;color:#fff;border:none;border-radius:6px;font-weight:600}
    button:hover{background:#078989}
    button:disabled{opacity:0.6;cursor:not-allowed}
    .section{margin:30px 0;padding:20px;background:#f9f9f9;border-radius:8px}
    .inquiry-item{background:#fff;padding:16px;margin:12px 0;border-radius:8px;border:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    .inquiry-info{flex:1;min-width:200px}
    .inquiry-meta{font-size:0.9em;color:#666;margin-top:4px}
    .status-badge{padding:4px 12px;border-radius:12px;font-size:0.85em;font-weight:600;display:inline-block}
    .status-pending{background:#fff3cd;color:#856404}
    .status-reviewed{background:#d1ecf1;color:#0c5460}
    .status-invoiced{background:#d4edda;color:#155724}
    .status-invoice-sent{background:#cfe2ff;color:#084298}
    .status-payment-received{background:#d1e7dd;color:#0f5132}
    .status-shipped{background:#d0d4f7;color:#3d3a8f}
    .download-link{color:#0aa7a7;text-decoration:none;font-weight:600;margin-left:8px}
    .download-link:hover{text-decoration:underline}
    .status-select{padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:0.85em;font-weight:600;cursor:pointer;background:#fff}
    .status-select.status-pending{background:#fff3cd;color:#856404}
    .status-select.status-invoice-sent{background:#cfe2ff;color:#084298}
    .status-select.status-payment-received{background:#d1e7dd;color:#0f5132}
    .status-select.status-shipped{background:#d0d4f7;color:#3d3a8f}
    .status-select.status-invoiced{background:#d4edda;color:#155724}
    .status-select.status-reviewed{background:#d1ecf1;color:#0c5460}
    .status-select:focus{outline:2px solid #0aa7a7;outline-offset:2px}
    .btn-group{display:flex;gap:8px;flex-wrap:wrap}
    .btn-small{padding:6px 12px;font-size:0.9em;width:auto}
    .btn-secondary{background:#6c757d}
    .btn-secondary:hover{background:#5a6268}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;overflow-y:auto;padding:20px}
    .modal-content{background:#fff;max-width:800px;margin:0 auto;padding:24px;border-radius:8px;position:relative}
    .modal-close{position:absolute;top:12px;right:12px;background:#dc3545;width:32px;height:32px;border-radius:50%;border:none;color:#fff;cursor:pointer;font-size:20px;line-height:1}
    .modal-close:hover{background:#c82333}
    .detail-row{margin:12px 0;padding:12px;background:#f9f9f9;border-radius:6px}
    .detail-label{font-weight:600;color:#333;margin-bottom:4px}
    .detail-value{color:#666}
    .items-list{margin:8px 0}
    .item-row{display:flex;justify-content:space-between;padding:8px;background:#fff;margin:4px 0;border-radius:4px}
    .totals-box{background:#e7f5f5;padding:16px;border-radius:6px;margin-top:16px}
    .totals-row{display:flex;justify-content:space-between;margin:8px 0}
    .totals-total{font-size:1.2em;font-weight:700;color:#0aa7a7;border-top:2px solid #0aa7a7;padding-top:8px;margin-top:8px}
    #result{margin-top:12px;padding:12px;background:#d4edda;color:#155724;border-radius:6px;display:none}
    #result a{color:#155724;font-weight:600;text-decoration:underline}
    .blog-item{background:#fff;padding:16px;margin:12px 0;border-radius:8px;border:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    .blog-info{flex:1;min-width:200px}
    .blog-meta{font-size:0.9em;color:#666;margin-top:4px}
    .status-draft{background:#f8f9fa;color:#6c757d}
    .status-published{background:#d4edda;color:#155724}
    .blog-image-preview{max-width:200px;max-height:150px;margin-top:8px;border-radius:4px}
    .comment-item{background:#fff;padding:12px;margin:8px 0;border-radius:6px;border-left:3px solid #0aa7a7}
    .comment-meta{font-size:0.85em;color:#999;margin-top:4px}
    .comment-content{margin-top:8px;color:#555}
    #quill-editor{height:300px;margin:12px 0}
  </style>
</head>
<body>

<h2>Laska Legacy Admin</h2>

<div id="login">
  <input id="pwd" type="password" placeholder="Password"/>
  <button onclick="doLogin()">Login</button>
</div>

<div id="panel" style="display:none">
  <div class="section">
    <h3>Create Invoice (Manual)</h3>
    <textarea id="items" rows="6" placeholder='[{"name":"Leather Belt + Buckle","qty":2}]'></textarea>
    <select id="route">
      <option value="locker-locker">Locker → Locker</option>
      <option value="locker-door">Locker → Door</option>
      <option value="locker-kiosk">Locker → Kiosk</option>
      <option value="kiosk-door">Kiosk → Door</option>
    </select>
    <button onclick="createInvoice()">Generate Invoice</button>
    <div id="result"></div>
  </div>

  <div class="section">
    <h3>Client Inquiries</h3>
    <button onclick="loadInquiries()" class="btn-small" style="width:auto;margin-bottom:12px">Refresh</button>
    <div id="inquiries-list"></div>
  </div>

  <div class="section">
    <h3>Blog Management - Between the Poles</h3>
    <button onclick="showBlogForm()" class="btn-small" style="width:auto;margin-bottom:12px">Create New Post</button>
    <button onclick="loadBlogPosts()" class="btn-small" style="width:auto;margin-bottom:12px">Refresh</button>
    <div id="blog-posts-list"></div>
  </div>

  <div class="section">
    <h3>Comments Management</h3>
    <button onclick="loadPendingComments()" class="btn-small" style="width:auto;margin-bottom:12px">Refresh</button>
    <div id="comments-list"></div>
  </div>
</div>

<div id="inquiry-modal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="inquiry-detail"></div>
  </div>
</div>

<div id="blog-modal" class="modal">
  <div class="modal-content" style="max-width:1000px">
    <button class="modal-close" onclick="closeBlogModal()">×</button>
    <div id="blog-form-content"></div>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<script>
let currentInquiry = null
let currentBlogPost = null
let quillEditor = null

async function doLogin(){
  const loginDiv = document.getElementById('login')
  const panelDiv = document.getElementById('panel')
  const pwdInput = document.getElementById('pwd')

  const r = await fetch('/api/admin-login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: pwdInput.value })
  })

  if(r.ok){
    loginDiv.style.display='none'
    panelDiv.style.display='block'
    loadInquiries()
    loadBlogPosts()
    loadPendingComments()
  } else {
    alert("Wrong password")
  }
}

async function createInvoice(){
  const items = document.getElementById('items').value
  const route = document.getElementById('route').value
  const result = document.getElementById('result')

  try {
    const r = await fetch('/api/create-invoice',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        items:JSON.parse(items),
        route:route
      })
    })

    const j = await r.json()
    result.style.display = 'block'
    result.innerHTML = `<a href="${j.url}" target="_blank">Download Invoice</a>`
  } catch(e) {
    result.style.display = 'block'
    result.innerHTML = 'Error: ' + e.message
  }
}

async function loadInquiries(){
  const listDiv = document.getElementById('inquiries-list')
  listDiv.innerHTML = '<p>Loading...</p>'

  try {
    const r = await fetch('/api/get-inquiries')
    if(!r.ok) throw new Error('Failed to load inquiries')
    
    const inquiries = await r.json()
    
    if(inquiries.length === 0) {
      listDiv.innerHTML = '<p>No inquiries yet.</p>'
      return
    }

    listDiv.innerHTML = inquiries.map(inq => `
      <div class="inquiry-item">
        <div class="inquiry-info">
          <div><strong>${inq.client.name}</strong> - ${inq.client.email}</div>
          <div class="inquiry-meta">
            ${new Date(inq.createdAt).toLocaleString()} | 
            ${inq.items.length} item(s) | 
            Total: R${inq.totals.total.toFixed(2)}
            ${inq.invoiceUrl ? ` | <a href="${inq.invoiceUrl}" target="_blank" class="download-link">📄 Download Invoice</a>` : ''}
          </div>
        </div>
        <div class="btn-group">
          <select class="status-select status-${inq.status}" onchange="updateInquiryStatus('${inq.id}', this.value)">
            <option value="pending" ${inq.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="invoice-sent" ${inq.status === 'invoice-sent' ? 'selected' : ''}>Invoice Sent</option>
            <option value="payment-received" ${inq.status === 'payment-received' ? 'selected' : ''}>Payment Received</option>
            <option value="shipped" ${inq.status === 'shipped' ? 'selected' : ''}>Shipped</option>
            <option value="invoiced" ${inq.status === 'invoiced' ? 'selected' : ''}>Invoiced</option>
          </select>
          <button class="btn-small btn-secondary" onclick="viewInquiry('${inq.id}')">View Details</button>
          <button class="btn-small" onclick="generateInvoiceFromInquiry('${inq.id}')" ${inq.status === 'invoiced' ? 'disabled' : ''}>Generate Invoice</button>
        </div>
      </div>
    `).join('')
  } catch(e) {
    listDiv.innerHTML = '<p style="color:red">Error loading inquiries: ' + e.message + '</p>'
  }
}

async function viewInquiry(id){
  try {
    const r = await fetch(`/api/get-inquiry?id=${id}`)
    if(!r.ok) throw new Error('Failed to load inquiry')
    
    const inquiry = await r.json()
    currentInquiry = inquiry

    const modal = document.getElementById('inquiry-modal')
    const detailDiv = document.getElementById('inquiry-detail')

    const routeLabels = {
      'locker-locker': 'Locker → Locker',
      'locker-door': 'Locker → Door',
      'locker-kiosk': 'Locker → Kiosk',
      'kiosk-door': 'Kiosk → Door'
    }

    detailDiv.innerHTML = `
      <h2>Inquiry Details</h2>
      
      <div class="detail-row">
        <div class="detail-label">Status</div>
        <div class="detail-value"><span class="status-badge status-${inquiry.status}">${inquiry.status}</span></div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Client Information</div>
        <div class="detail-value">
          <strong>Name:</strong> ${inquiry.client.name}<br>
          <strong>Email:</strong> ${inquiry.client.email}<br>
          <strong>Phone:</strong> ${inquiry.client.phone}<br>
          <strong>Address:</strong> ${inquiry.client.address}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Products</div>
        <div class="detail-value">
          <div class="items-list">
            ${inquiry.items.map(item => `
              <div class="item-row">
                <span>${item.name} x${item.qty} (${item.pudoSize})</span>
                <span>R${item.lineTotal.toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Shipping</div>
        <div class="detail-value">
          <strong>Route:</strong> ${routeLabels[inquiry.shipping.route] || inquiry.shipping.route}<br>
          <strong>Size:</strong> ${inquiry.shipping.size}<br>
          <strong>Cost:</strong> R${inquiry.shipping.cost.toFixed(2)}
        </div>
      </div>

      <div class="totals-box">
        <div class="totals-row">
          <span>Products Subtotal:</span>
          <span>R${inquiry.totals.products.toFixed(2)}</span>
        </div>
        <div class="totals-row">
          <span>Shipping:</span>
          <span>R${inquiry.totals.shipping.toFixed(2)}</span>
        </div>
        <div class="totals-row totals-total">
          <span>Total:</span>
          <span>R${inquiry.totals.total.toFixed(2)}</span>
        </div>
      </div>

      <div style="margin-top:20px">
        ${inquiry.invoiceUrl ? `
          <a href="${inquiry.invoiceUrl}" target="_blank" class="download-link" style="display:inline-block;margin-right:12px;padding:10px 16px;background:#0aa7a7;color:#fff;text-decoration:none;border-radius:6px;font-weight:600">
            📄 Download Invoice
          </a>
        ` : ''}
        <button onclick="generateInvoiceFromInquiry('${inquiry.id}')" ${inquiry.status === 'invoiced' ? 'disabled' : ''}>
          Generate Invoice
        </button>
      </div>
    `

    modal.style.display = 'block'
  } catch(e) {
    alert('Error loading inquiry: ' + e.message)
  }
}

function closeModal(){
  document.getElementById('inquiry-modal').style.display = 'none'
  currentInquiry = null
}

async function generateInvoiceFromInquiry(id){
  try {
    // Get inquiry details
    const r = await fetch(`/api/get-inquiry?id=${id}`)
    if(!r.ok) throw new Error('Failed to load inquiry')
    
    const inquiry = await r.json()

    // Generate invoice
    const invoiceR = await fetch('/api/create-invoice', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        inquiryId: inquiry.id,
        items: inquiry.items.map(item => ({ name: item.name, qty: item.qty })),
        route: inquiry.shipping.route,
        client: inquiry.client,
        shipping: inquiry.shipping,
        totals: inquiry.totals
      })
    })

    if(!invoiceR.ok) {
      const errorText = await invoiceR.text()
      let errorMessage = 'Failed to generate invoice'
      try {
        const errorJson = JSON.parse(errorText)
        errorMessage = errorJson.error || errorMessage
      } catch(e) {
        errorMessage = errorText || errorMessage
      }
      throw new Error(errorMessage)
    }

    const invoiceData = await invoiceR.json()

    // Store invoice URL in inquiry
    await fetch('/api/store-invoice-url', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id: inquiry.id, invoiceUrl: invoiceData.url })
    })

    // Update inquiry status
    await fetch('/api/update-inquiry-status', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id: inquiry.id, status: 'invoiced' })
    })

    // Show result
    alert('Invoice generated! Download link: ' + invoiceData.url)
    window.open(invoiceData.url, '_blank')
    
    // Refresh inquiries list
    loadInquiries()
    
    // Update modal if open
    if(currentInquiry && currentInquiry.id === id) {
      viewInquiry(id)
    }
  } catch(e) {
    alert('Error generating invoice: ' + e.message)
  }
}

// Close modal on outside click
document.getElementById('inquiry-modal').addEventListener('click', function(e) {
  if(e.target === this) {
    closeModal()
  }
})

function getStatusColor(status) {
  const colors = {
    'pending': '#fff3cd',
    'invoice-sent': '#cfe2ff',
    'payment-received': '#d1e7dd',
    'shipped': '#d0d4f7',
    'invoiced': '#d4edda',
    'reviewed': '#d1ecf1'
  }
  return colors[status] || '#f8f9fa'
}

async function updateInquiryStatus(id, status) {
  try {
    const r = await fetch('/api/update-inquiry-status', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id, status })
    })

    if(!r.ok) {
      const errorText = await r.text()
      let errorMessage = 'Failed to update status'
      try {
        const errorJson = JSON.parse(errorText)
        errorMessage = errorJson.error || errorMessage
      } catch(e) {
        errorMessage = errorText || errorMessage
      }
      throw new Error(errorMessage)
    }

    // Refresh inquiries list to show updated status
    loadInquiries()
  } catch(e) {
    alert('Error updating status: ' + e.message)
    // Reload to reset dropdown
    loadInquiries()
  }
}

// Blog Management Functions
async function loadBlogPosts(){
  const listDiv = document.getElementById('blog-posts-list')
  listDiv.innerHTML = '<p>Loading...</p>'

  try {
    const r = await fetch('/api/blog-posts')
    if(!r.ok) throw new Error('Failed to load blog posts')
    
    const posts = await r.json()
    
    if(posts.length === 0) {
      listDiv.innerHTML = '<p>No blog posts yet.</p>'
      return
    }

    listDiv.innerHTML = posts.map(post => `
      <div class="blog-item">
        <div class="blog-info">
          <div><strong>${post.title}</strong></div>
          <div class="blog-meta">
            ${new Date(post.publishDate).toLocaleString()} | 
            By ${post.author} | 
            <span class="status-badge status-${post.status}">${post.status}</span>
            ${post.categories && post.categories.length > 0 ? ` | ${post.categories.join(', ')}` : ''}
          </div>
        </div>
        <div class="btn-group">
          <button class="btn-small btn-secondary" onclick="editBlogPost('${post.id}')">Edit</button>
          <button class="btn-small" style="background:#dc3545" onclick="deleteBlogPost('${post.id}')">Delete</button>
        </div>
      </div>
    `).join('')
  } catch(e) {
    listDiv.innerHTML = '<p style="color:red">Error loading blog posts: ' + e.message + '</p>'
  }
}

function showBlogForm(post = null){
  currentBlogPost = post
  const modal = document.getElementById('blog-modal')
  const formDiv = document.getElementById('blog-form-content')
  
  const postData = post || {
    title: '',
    excerpt: '',
    content: '',
    featuredImage: '',
    author: '',
    categories: '',
    publishDate: new Date().toISOString().split('T')[0],
    status: 'draft',
    metaTitle: '',
    metaDescription: '',
    metaKeywords: ''
  }

  formDiv.innerHTML = `
    <h2>${post ? 'Edit' : 'Create'} Blog Post</h2>
    <form id="blog-post-form" onsubmit="saveBlogPost(event)">
      <input type="hidden" id="blog-post-id" value="${post ? post.id : ''}">
      
      <label>Title *</label>
      <input type="text" id="blog-title" value="${postData.title}" required>
      
      <label>Excerpt</label>
      <textarea id="blog-excerpt" rows="3">${postData.excerpt || ''}</textarea>
      
      <label>Content *</label>
      <div id="quill-editor"></div>
      
      <label>Featured Image URL</label>
      <input type="text" id="blog-featured-image" value="${postData.featuredImage || ''}" placeholder="Or upload image below">
      <input type="file" id="blog-image-upload" accept="image/*" onchange="uploadBlogImage(event)">
      <div id="blog-image-preview-container"></div>
      
      <label>Author *</label>
      <input type="text" id="blog-author" value="${postData.author}" required>
      
      <label>Categories (comma-separated)</label>
      <input type="text" id="blog-categories" value="${Array.isArray(postData.categories) ? postData.categories.join(', ') : (postData.categories || '')}">
      
      <label>Publish Date</label>
      <input type="datetime-local" id="blog-publish-date" value="${postData.publishDate ? new Date(postData.publishDate).toISOString().slice(0, 16) : ''}">
      
      <label>Status</label>
      <select id="blog-status">
        <option value="draft" ${postData.status === 'draft' ? 'selected' : ''}>Draft</option>
        <option value="published" ${postData.status === 'published' ? 'selected' : ''}>Published</option>
      </select>
      
      <h3 style="margin-top:24px">SEO Settings</h3>
      <label>Meta Title</label>
      <input type="text" id="blog-meta-title" value="${postData.metaTitle || ''}">
      
      <label>Meta Description</label>
      <textarea id="blog-meta-description" rows="2">${postData.metaDescription || ''}</textarea>
      
      <label>Meta Keywords (comma-separated)</label>
      <input type="text" id="blog-meta-keywords" value="${Array.isArray(postData.metaKeywords) ? postData.metaKeywords.join(', ') : (postData.metaKeywords || '')}">
      
      <div style="margin-top:20px">
        <button type="submit">${post ? 'Update' : 'Create'} Post</button>
        <button type="button" onclick="closeBlogModal()" style="background:#6c757d;margin-left:12px">Cancel</button>
      </div>
    </form>
  `
  
  // Initialize Quill editor
  if(quillEditor) quillEditor = null
  quillEditor = new Quill('#quill-editor', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        [{ 'color': [] }, { 'background': [] }],
        ['link', 'image'],
        ['clean']
      ]
    }
  })
  
  if(postData.content) {
    quillEditor.root.innerHTML = postData.content
  }
  
  modal.style.display = 'block'
}

async function uploadBlogImage(event){
  const file = event.target.files[0]
  if(!file) return
  
  const formData = new FormData()
  formData.append('file', file)
  
  try {
    const r = await fetch('/api/upload-blog-image', {
      method: 'POST',
      body: formData
    })
    
    if(!r.ok) throw new Error('Upload failed')
    
    const data = await r.json()
    document.getElementById('blog-featured-image').value = data.url
    document.getElementById('blog-image-preview-container').innerHTML = `
      <img src="${data.url}" class="blog-image-preview" alt="Preview">
    `
  } catch(e) {
    alert('Error uploading image: ' + e.message)
  }
}

async function saveBlogPost(event){
  event.preventDefault()
  
  const id = document.getElementById('blog-post-id').value
  const postData = {
    title: document.getElementById('blog-title').value,
    excerpt: document.getElementById('blog-excerpt').value,
    content: quillEditor.root.innerHTML,
    featuredImage: document.getElementById('blog-featured-image').value,
    author: document.getElementById('blog-author').value,
    categories: document.getElementById('blog-categories').value,
    publishDate: new Date(document.getElementById('blog-publish-date').value).toISOString(),
    status: document.getElementById('blog-status').value,
    metaTitle: document.getElementById('blog-meta-title').value,
    metaDescription: document.getElementById('blog-meta-description').value,
    metaKeywords: document.getElementById('blog-meta-keywords').value
  }
  
  try {
    const method = id ? 'PUT' : 'POST'
    const body = id ? { id, ...postData } : postData
    
    const r = await fetch('/api/blog-posts', {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    
    if(!r.ok) {
      const error = await r.json()
      throw new Error(error.error || 'Failed to save post')
    }
    
    alert(id ? 'Post updated successfully!' : 'Post created successfully!')
    closeBlogModal()
    loadBlogPosts()
  } catch(e) {
    alert('Error saving post: ' + e.message)
  }
}

async function editBlogPost(id){
  try {
    const r = await fetch(`/api/blog-posts?id=${id}`)
    if(!r.ok) throw new Error('Failed to load post')
    const post = await r.json()
    showBlogForm(post)
  } catch(e) {
    alert('Error loading post: ' + e.message)
  }
}

async function deleteBlogPost(id){
  if(!confirm('Are you sure you want to delete this post?')) return
  
  try {
    const r = await fetch(`/api/blog-posts?id=${id}`, {
      method: 'DELETE'
    })
    
    if(!r.ok) throw new Error('Failed to delete post')
    
    alert('Post deleted successfully!')
    loadBlogPosts()
  } catch(e) {
    alert('Error deleting post: ' + e.message)
  }
}

function closeBlogModal(){
  document.getElementById('blog-modal').style.display = 'none'
  currentBlogPost = null
  if(quillEditor) quillEditor = null
}

// Comments Management Functions
async function loadPendingComments(){
  const listDiv = document.getElementById('comments-list')
  listDiv.innerHTML = '<p>Loading...</p>'

  try {
    // Get all blog posts to find comments
    const postsR = await fetch('/api/blog-posts')
    if(!postsR.ok) throw new Error('Failed to load posts')
    const posts = await postsR.json()
    
    // Get comments for each post
    const allComments = []
    for(const post of posts) {
      try {
        const commentsR = await fetch(`/api/get-comments?postId=${post.id}`)
        if(commentsR.ok) {
          const commentsData = await commentsR.json()
          const comments = commentsData.comments || []
          comments.forEach(comment => {
            if(!comment.approved) {
              allComments.push({ ...comment, postTitle: post.title, postId: post.id })
            }
          })
        }
      } catch(e) {
        console.error('Error loading comments for post', post.id, e)
      }
    }
    
    if(allComments.length === 0) {
      listDiv.innerHTML = '<p>No pending comments.</p>'
      return
    }

    listDiv.innerHTML = allComments.map(comment => `
      <div class="comment-item">
        <div>
          <div><strong>${comment.author}</strong> (${comment.email})</div>
          <div class="comment-meta">
            On: <strong>${comment.postTitle}</strong> | 
            ${new Date(comment.createdAt).toLocaleString()}
          </div>
          <div class="comment-content">${comment.content}</div>
        </div>
        <div class="btn-group">
          <button class="btn-small" onclick="approveComment('${comment.postId}', '${comment.id}', true)">Approve</button>
          <button class="btn-small" style="background:#dc3545" onclick="deleteComment('${comment.postId}', '${comment.id}')">Delete</button>
        </div>
      </div>
    `).join('')
  } catch(e) {
    listDiv.innerHTML = '<p style="color:red">Error loading comments: ' + e.message + '</p>'
  }
}

async function approveComment(postId, commentId, approved){
  try {
    const r = await fetch('/api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postId, commentId, approved })
    })
    
    if(!r.ok) throw new Error('Failed to update comment')
    
    alert('Comment ' + (approved ? 'approved' : 'rejected') + '!')
    loadPendingComments()
  } catch(e) {
    alert('Error updating comment: ' + e.message)
  }
}

async function deleteComment(postId, commentId){
  if(!confirm('Are you sure you want to delete this comment?')) return
  
  try {
    const r = await fetch(`/api/comments?postId=${postId}&commentId=${commentId}`, {
      method: 'DELETE'
    })
    
    if(!r.ok) throw new Error('Failed to delete comment')
    
    alert('Comment deleted!')
    loadPendingComments()
  } catch(e) {
    alert('Error deleting comment: ' + e.message)
  }
}

// Close blog modal on outside click
document.getElementById('blog-modal')?.addEventListener('click', function(e) {
  if(e.target === this) {
    closeBlogModal()
  }
})
</script>
